[package]
name = "hari-tzatxu"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "hari-tzatxu"
path = "src/main.rs"

[dependencies]
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
