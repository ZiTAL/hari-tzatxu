# Keep these settings in sync with ../../.cargo/config.toml.
#
# The paths are relative to this file's parent directory so the checkout can
# build on another machine. The rustc wrapper steps into app/ before invoking
# the real compiler because Craft Anything starts the build inside a folder it
# can delete immediately; without it rustc fails with
# "Current directory is invalid". The wrapper also restores PATH, so the
# linker can be found by name.
[build]
rustc = ".cargo/rustc-shim.sh"
target-dir = "target"

[target.x86_64-unknown-linux-gnu]
linker = "cc"

[target.aarch64-unknown-linux-gnu]
linker = "cc"
