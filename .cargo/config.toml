# Cargo reads this file when it is started from the project folder rather than
# from app/, so it repeats what app/.cargo/config.toml says. Keep them in sync.
#
# The paths are relative to this file's parent directory so a clone can build
# on another machine. The rustc wrapper steps into app/ before invoking the
# real compiler: Craft Anything starts the build in a folder it can delete
# immediately, and rustc otherwise fails with "Current directory is invalid".
# The wrapper restores PATH, so the linker can be found by name.
[build]
rustc = "app/.cargo/rustc-shim.sh"
target-dir = "app/target"

[target.x86_64-unknown-linux-gnu]
linker = "cc"

[target.aarch64-unknown-linux-gnu]
linker = "cc"
